name: Auto Unzip File

on:
  push:
    paths:
      - '**.zip' # Triggers only when a zip file is pushed
  workflow_dispatch: # Allows you to run this manually from the Actions tab

jobs:
  unzip-file:
    runs-on: ubuntu-latest
    permissions:
      contents: write # Allows the action to commit files back to your repo

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Extract Zip Files
        run: |
          for file in *.zip; do
            if [ -f "$file" ]; then
              echo "Extracting $file..."
              # Extracts the file into a folder named after the zip file
              unzip -o "$file" -d "${file%.zip}" 
              # Optional: Delete the original zip file after extraction
              rm "$file" 
            fi
          done

      - name: Commit and Push Changes
        uses: stefanzweimex/git-auto-commit-action@v5
        with:
          commit_message: "Automated: Unzipped archives and cleaned up source files"
          
